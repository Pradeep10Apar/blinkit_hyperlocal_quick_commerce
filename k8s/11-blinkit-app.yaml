# ═══════════════════════════════════════════════════════════════════════════════
# Blinkit App (Products, Cart, Orders)
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: ConfigMap
metadata:
  name: blinkit-app-config
  namespace: blinkit
data:
  SPRING_PROFILES_ACTIVE: kubernetes
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-blinkit:5432/blinkit
  SPRING_DATA_REDIS_HOST: redis
  SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  # Elasticsearch URL - must match property path: app.elasticsearch.url
  APP_ELASTICSEARCH_URL: http://elasticsearch:9200
  APP_ELASTIC_BASE_URL: http://elasticsearch:9200
  EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka:8761/eureka
  INVENTORY_SERVICE_URL: http://INVENTORY-SERVICE
  # Register with IP address instead of hostname for Kubernetes DNS resolution
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blinkit-app
  namespace: blinkit
spec:
  replicas: 2    # ← 2 instances for load balancing demo
  selector:
    matchLabels:
      app: blinkit-app
  template:
    metadata:
      labels:
        app: blinkit-app
    spec:
      containers:
        - name: blinkit-app
          image: blinkit-app:v1
          imagePullPolicy: Never    # Use local image
          ports:
            - containerPort: 8088
          envFrom:
            - configMapRef:
                name: blinkit-app-config
          env:
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-blinkit-secret
                  key: POSTGRES_PASSWORD
            - name: SERVER_PORT
              value: "8088"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8088
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8088
            initialDelaySeconds: 90
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: blinkit-app
  namespace: blinkit
spec:
  selector:
    app: blinkit-app
  ports:
    - port: 8088
      targetPort: 8088
---
# HorizontalPodAutoscaler for auto-scaling
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: blinkit-app-hpa
  namespace: blinkit
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: blinkit-app
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
