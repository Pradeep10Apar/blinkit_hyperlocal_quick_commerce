# ═══════════════════════════════════════════════════════════════════════════════
# API Gateway
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: blinkit
data:
  SPRING_PROFILES_ACTIVE: kubernetes
  EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka:8761/eureka
  # Register with IP address instead of hostname for Kubernetes DNS resolution
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: blinkit
spec:
  replicas: 2    # ← 2 instances
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:v1
          imagePullPolicy: Never    # Use local image
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef:
                name: api-gateway-config
          env:
            - name: SERVER_PORT
              value: "8085"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "768Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: blinkit
spec:
  type: NodePort    # ← Exposes gateway to localhost
  selector:
    app: api-gateway
  ports:
    - port: 8085
      targetPort: 8085
      nodePort: 30085    # ← Access via localhost:30085
