services:
  # ─── Kafka Broker (KRaft mode – no Zookeeper needed!) ───
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka-playground
    ports:
      - "9092:9092"       # For your Java app to connect
    environment:
      # KRaft combined mode (broker + controller in one node)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Listeners — host gets PLAINTEXT on 9092, controller on 9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Cluster ID (required for KRaft — valid Base64 22-char string)
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qko

      # Topic defaults
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      # Replication (single broker)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  # ─── Kafka UI – Visual dashboard to see topics, messages, partitions ───
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8090:8080"
    depends_on:
      - kafka
    environment:
      - KAFKA_CLUSTERS_0_NAME=kafka-playground
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
